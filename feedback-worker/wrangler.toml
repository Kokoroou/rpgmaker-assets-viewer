# Cloudflare Worker that receives MakerLens feedback. See README.md in this folder.
# Public URL: https://makerlens-feedback.kokoroou.workers.dev
# (if you rename it, update ENDPOINT in js/feedback.js and connect-src in index.html,
#  and ALLOWED_HOSTS in scripts/check-site.mjs)
name = "makerlens-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Only the public site may submit.
[vars]
ALLOWED_ORIGINS = "https://kokoroou.github.io"

[[d1_databases]]
binding = "DB"
database_name = "makerlens-feedback"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Per-IP counter kept in Cloudflare's memory only — never written to the database.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# No request logs: Workers Logs would store IPs and headers.
[observability]
enabled = false

# Secret, set with: wrangler secret put ADMIN_TOKEN   (protects the read endpoints)
